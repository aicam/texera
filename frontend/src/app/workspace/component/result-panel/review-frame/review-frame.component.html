<div class="frame">
  <div class="bar">
    <nz-radio-group [(ngModel)]="mode">
      <label
        nz-radio-button
        nzValue="review">
        Review
      </label>
      <label
        nz-radio-button
        nzValue="records">
        Records
      </label>
    </nz-radio-group>
    <button
      nz-button
      nzType="primary"
      [disabled]="!ownToken"
      (click)="generateLink()">
      Generate Link
    </button>
  </div>

  <div
    *ngIf="shared"
    class="share">
    <div class="share-top">
      <nz-qrcode
        [nzValue]="shared.url"
        [nzSize]="132"
        nzLevel="L"></nz-qrcode>
      <div class="share-text">
        Scan with a phone camera, or send the link. Anyone with it can label from a phone or computer, without a Texera
        account, until {{ shared.expiresAt | date: "MMM d" }}. Labels are saved as you.
      </div>
    </div>
    <div class="share-row">
      <input
        nz-input
        readonly
        [value]="shared.url"
        (focus)="$any($event.target).select()" />
      <button
        nz-button
        (click)="copy()">
        {{ copied ? "Copied" : "Copy" }}
      </button>
      <a
        nz-button
        [href]="shared.url"
        target="_blank"
        rel="noopener">
        Open
      </a>
    </div>
  </div>

  <div
    *ngIf="error"
    class="error">
    {{ error }}
  </div>

  <texera-labeling-page
    *ngIf="mode === 'review' && ownToken"
    [token]="ownToken"
    [annotator]="annotator"
    [embedded]="true"></texera-labeling-page>

  <texera-label-records
    *ngIf="mode === 'records' && scans && labels && queue"
    [scans]="scans"
    [labels]="labels"
    [queue]="queue"></texera-label-records>
</div>
