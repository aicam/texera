<!-- Collapsed: floating button to open the panel -->
<button
  *ngIf="!isOpen"
  id="agent-docked-button"
  nz-button
  nzType="primary"
  nzShape="circle"
  nzSize="large"
  (click)="togglePanel()"
  nz-tooltip
  nzTooltipPlacement="left"
  nzTooltipTitle="AI Agents">
  <span
    nz-icon
    nzType="robot"></span>
</button>

<!-- Open: docked panel -->
<div
  *ngIf="isOpen"
  class="dock-panel">
  <!-- Left-edge resize splitter -->
  <div
    class="dock-resizer"
    title="Drag to resize"
    (mousedown)="startResize($event)"></div>

  <div class="dock-body">
    <div class="dock-header">
      <span class="dock-title">AI Agents</span>
      <button
        nz-button
        nzType="text"
        nzSize="small"
        class="dock-minimize"
        (click)="togglePanel()"
        nz-tooltip
        nzTooltipTitle="Collapse panel">
        <span
          nz-icon
          nzType="minus"></span>
      </button>
    </div>

    <texera-agent-workbench></texera-agent-workbench>
  </div>
</div>
