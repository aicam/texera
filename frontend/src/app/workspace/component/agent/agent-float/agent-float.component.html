<ng-container *ngIf="copilotEnabled">
  <!-- Collapsed: floating button to open the panel -->
  <button
    *ngIf="!isOpen"
    id="agent-docked-button"
    nz-button
    nzType="primary"
    nzShape="circle"
    nzSize="large"
    (click)="togglePanel()"
    nz-tooltip
    nzTooltipPlacement="left"
    nzTooltipTitle="AI Agents">
    <span
      nz-icon
      nzType="robot"></span>
  </button>

  <!-- Open: floating, draggable, resizable panel -->
  <div
    *ngIf="isOpen"
    class="float-panel"
    cdkDrag
    [cdkDragFreeDragPosition]="dragPosition"
    (cdkDragEnded)="onDragEnded($event)"
    [style.width.px]="width"
    [style.height.px]="height">
    <!-- Resize handles (panel is anchored top-right, grows toward bottom-left) -->
    <div
      class="float-resizer float-resizer-left"
      (mousedown)="startResize($event, 'left')"></div>
    <div
      class="float-resizer float-resizer-bottom"
      (mousedown)="startResize($event, 'bottom')"></div>
    <div
      class="float-resizer float-resizer-corner-bl"
      (mousedown)="startResize($event, 'bottom-left')"></div>

    <div class="float-header" cdkDragHandle>
      <span class="float-title">AI Agents</span>
      <button
        nz-button
        nzType="text"
        nzSize="small"
        class="float-minimize"
        (click)="togglePanel()"
        nz-tooltip
        nzTooltipTitle="Collapse panel">
        <span
          nz-icon
          nzType="minus"></span>
      </button>
    </div>

    <texera-agent-workbench></texera-agent-workbench>
  </div>
</ng-container>
