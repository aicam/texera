{{/*
Materializes the cloudmapper runtime Secrets from values, instead of relying
on resources created out-of-band with kubectl. Each block renders only when its
inline value is supplied (mirrors storage.s3.existingSecret): provide the value
and the chart owns the resource; leave it empty and the deployment falls back to
a pre-existing resource of the same name. The config.yaml is baked into the
image at /app/config/config.yaml, so it is not templated here.

  cloudmapper.awsAccessKeyId / awsSecretAccessKey -> Secret  awsSecret
  cloudmapper.sshPrivateKey  / sshPublicKey       -> Secret  sshKeySecret
*/}}
{{- if .Values.cloudmapper.enabled }}
{{- if .Values.cloudmapper.awsAccessKeyId }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.cloudmapper.awsSecret | default "cloudmapper-aws-credentials" }}
  namespace: {{ .Release.Namespace }}
type: Opaque
stringData:
  AWS_ACCESS_KEY_ID: {{ .Values.cloudmapper.awsAccessKeyId | quote }}
  AWS_SECRET_ACCESS_KEY: {{ .Values.cloudmapper.awsSecretAccessKey | quote }}
{{- end }}
{{- if .Values.cloudmapper.sshPrivateKey }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.cloudmapper.sshKeySecret | default "cloudmapper-ssh-key" }}
  namespace: {{ .Release.Namespace }}
type: Opaque
stringData:
  cloudmapper_id_rsa: |-
{{ .Values.cloudmapper.sshPrivateKey | indent 4 }}
  cloudmapper_id_rsa.pub: |-
{{ .Values.cloudmapper.sshPublicKey | indent 4 }}
{{- end }}
{{- end }}
