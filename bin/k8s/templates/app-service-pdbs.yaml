# PodDisruptionBudgets for the replicated, stateless app services.
#
# These services intentionally do NOT carry the karpenter.sh/do-not-disrupt
# annotation: they run multiple replicas with no anti-affinity, so Karpenter is
# free to consolidate idle nodes by relocating pods. A PDB with maxUnavailable:1
# keeps each service continuously available (at most one replica down at a time)
# while still permitting that consolidation — the right trade-off for stateless,
# horizontally-replicated services. Singletons that cannot tolerate eviction
# (postgres, lakefs, gateway, the CU manager) keep do-not-disrupt instead.
#
# agent-service is special: at numOfPods <= 1 it is a stateful singleton and keeps
# do-not-disrupt (set in agent-service-deployment.yaml), so it is NOT listed here.
# At numOfPods > 1, session-affinity routing makes its replicas evictable, so it is
# appended to the PDB list below (maxUnavailable 1) and the annotation is dropped.
#
# bio-mcp follows the same rule: only multi-replica (numOfPods > 1) when enabled. Its
# ClientIP session affinity + agent-service session recovery make replicas evictable.
{{- $agentPods := int (.Values.agentService.numOfPods | default 1) -}}
{{- $pdbServices := list .Values.webserver.name .Values.accessControlService.name .Values.configService.name .Values.fileService.name .Values.litellm.name .Values.workflowCompilingService.name -}}
{{- if gt $agentPods 1 }}
{{- $pdbServices = append $pdbServices .Values.agentService.name }}
{{- end }}
{{- if and .Values.bioMcpService.enabled (gt (int (.Values.bioMcpService.numOfPods | default 1)) 1) }}
{{- $pdbServices = append $pdbServices .Values.bioMcpService.name }}
{{- end }}
{{- range $svc := $pdbServices }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ $.Release.Name }}-{{ $svc }}-pdb
  namespace: {{ $.Release.Namespace }}
  labels:
    app: {{ $.Release.Name }}-{{ $svc }}
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app: {{ $.Release.Name }}-{{ $svc }}
{{- end }}
