{{- if .Values.agentService.enabled }}
{{- $promptMounted := or .Values.agentService.systemPromptOverride (.Files.Get "files/system-prompt.md") }}
{{- $agentPods := int (.Values.agentService.numOfPods | default 1) }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-{{ .Values.agentService.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Release.Name }}-{{ .Values.agentService.name }}
spec:
  replicas: {{ .Values.agentService.numOfPods | default 1 }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}-{{ .Values.agentService.name }}
  template:
    metadata:
{{- if le $agentPods 1 }}
      annotations:
        # Single replica (numOfPods <= 1): the in-memory agentStore + per-pod ReAct
        # runs/WebSockets make this pod a stateful singleton, so keep it off Karpenter's
        # consolidation path (evicting the only pod drops every live run) and out of
        # app-service-pdbs.yaml (a PDB is meaningless on one replica). With numOfPods > 1,
        # session-affinity routing (agent-service-backend-traffic-policy.yaml) makes pods
        # evictable: this annotation is dropped and a PDB (maxUnavailable 1) is added instead.
        karpenter.sh/do-not-disrupt: "true"
{{- end }}
      labels:
        app: {{ .Release.Name }}-{{ .Values.agentService.name }}
    spec:
      containers:
        - name: {{ .Values.agentService.name }}
          image: {{ .Values.texera.imageRegistry }}/{{ .Values.agentService.imageName }}:{{ .Values.texera.imageTag }}
          imagePullPolicy: {{ .Values.texeraImages.pullPolicy }}
          ports:
            - containerPort: {{ .Values.agentService.service.port }}
          # Env names match the agent service's config schema (agent-service/src/config/env.ts).
          env:
            - name: PORT
              value: "{{ .Values.agentService.service.port }}"
            # Dashboard service: workflow CRUD + operator metadata.
            - name: TEXERA_DASHBOARD_SERVICE_ENDPOINT
              value: http://{{ .Values.webserver.name }}-svc:{{ .Values.webserver.service.port }}
            # File service: dataset APIs. The dashboard service does not proxy
            # /api/dataset when called directly inside the cluster.
            - name: FILE_SERVICE_ENDPOINT
              value: http://{{ .Values.fileService.name }}-svc:{{ .Values.fileService.service.port }}
            # LLM gateway: access-control-service serves /api/chat and /api/models,
            # forwarding to LiteLLM (mirrors the single-node nginx routing).
            - name: LLM_ENDPOINT
              value: http://{{ .Values.accessControlService.name }}-svc:{{ .Values.accessControlService.service.port }}
            - name: WORKFLOW_COMPILING_SERVICE_ENDPOINT
              value: http://{{ .Values.workflowCompilingService.name }}-svc:{{ .Values.workflowCompilingService.service.port }}
            - name: STORAGE_JDBC_URL
              value: jdbc:postgresql://{{ .Release.Name }}-postgresql:5432/texera_db?currentSchema=texera_db,public
            - name: STORAGE_JDBC_USERNAME
              value: postgres
            - name: STORAGE_JDBC_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-postgresql
                  key: postgres-password
            {{- range .Values.texeraEnvVars }}
            {{- if eq .name "AUTH_JWT_SECRET" }}
            - name: AUTH_JWT_SECRET
              value: "{{ .value }}"
            {{- end }}
            {{- end }}
            # Per-computing-unit execution endpoint; "{cuid}" is substituted with the
            # computing unit id at request time.
            - name: EXECUTION_ENDPOINT_TEMPLATE
              value: http://computing-unit-{cuid}.{{ .Values.workflowComputingUnitPool.name }}-svc.{{ .Values.workflowComputingUnitPool.namespace }}.svc.cluster.local:{{ .Values.workflowComputingUnitPool.service.port }}
            - name: LLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-agent-service-secret
                  key: llm-api-key
            {{- if .Values.bioMcpService.enabled }}
            - name: MCP_SERVERS
              value: '[{"name":"biomcp","url":"http://{{ .Values.bioMcpService.name }}-svc:{{ .Values.bioMcpService.service.port }}/mcp","toolPrefix":"biomcp","apiKeyEnv":"BIOMCP_API_KEY"}]'
            - name: BIOMCP_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-bio-mcp-service-secret
                  key: biomcp-api-key
            {{- end }}
            # Agent config (see agent-service/src/config/env.ts). When a system-prompt override
            # is provided it is mounted from a ConfigMap; the settings below override built-ins.
            {{- if $promptMounted }}
            - name: AGENT_SYSTEM_PROMPT_PATH
              value: /etc/agent-config/system-prompt.md
            {{- end }}
            {{- with .Values.agentService.env }}
            # Generic MCP transport timeout — applies to every remote MCP server, so it is emitted
            # whenever agent-service is enabled (not gated on bioMcpService).
            {{- if .mcpRequestTimeoutMs }}
            - name: MCP_REQUEST_TIMEOUT_MS
              value: "{{ .mcpRequestTimeoutMs }}"
            {{- end }}
            {{- if .maxOperatorResultCharLimit }}
            - name: AGENT_MAX_OPERATOR_RESULT_CHAR_LIMIT
              value: "{{ .maxOperatorResultCharLimit }}"
            {{- end }}
            {{- if .maxOperatorResultCellCharLimit }}
            - name: AGENT_MAX_OPERATOR_RESULT_CELL_CHAR_LIMIT
              value: "{{ .maxOperatorResultCellCharLimit }}"
            {{- end }}
            {{- if .executionTimeoutMs }}
            - name: AGENT_EXECUTION_TIMEOUT_MS
              value: "{{ .executionTimeoutMs }}"
            {{- end }}
            {{- if .maxSteps }}
            - name: AGENT_MAX_STEPS
              value: "{{ .maxSteps }}"
            {{- end }}
            {{- if .repeatedToolCallThreshold }}
            - name: AGENT_REPEATED_TOOL_CALL_THRESHOLD
              value: "{{ .repeatedToolCallThreshold }}"
            {{- end }}
            {{- if .maxContextTokens }}
            - name: AGENT_MAX_CONTEXT_TOKENS
              value: "{{ .maxContextTokens }}"
            {{- end }}
            # Additive: unioned on top of the agent's built-in always-excluded operator list.
            {{- if .extraExcludedOperatorTypes }}
            - name: AGENT_EXTRA_EXCLUDED_OPERATOR_TYPES
              value: "{{ .extraExcludedOperatorTypes }}"
            {{- end }}
            {{- end }}
          # The service loads operator metadata from the dashboard service on
          # startup, so gate readiness on its health endpoint before the gateway
          # routes traffic here. /api/healthcheck needs no auth.
          readinessProbe:
            httpGet:
              path: /api/healthcheck
              port: {{ .Values.agentService.service.port }}
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/healthcheck
              port: {{ .Values.agentService.service.port }}
            initialDelaySeconds: 15
            periodSeconds: 10
          {{- if $promptMounted }}
          volumeMounts:
            - name: agent-system-prompt
              mountPath: /etc/agent-config
              readOnly: true
          {{- end }}
      {{- if $promptMounted }}
      volumes:
        - name: agent-system-prompt
          configMap:
            name: {{ .Release.Name }}-{{ .Values.agentService.name }}-system-prompt
      {{- end }}
{{- end }}
