{{- if .Values.bioMcpService.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-{{ .Values.bioMcpService.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Release.Name }}-{{ .Values.bioMcpService.name }}
spec:
  replicas: {{ .Values.bioMcpService.numOfPods | default 1 }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}-{{ .Values.bioMcpService.name }}
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-{{ .Values.bioMcpService.name }}
    spec:
      containers:
        - name: {{ .Values.bioMcpService.name }}
          image: {{ .Values.texera.imageRegistry }}/{{ .Values.bioMcpService.imageName }}:{{ .Values.texera.imageTag }}
          imagePullPolicy: {{ .Values.texeraImages.pullPolicy }}
          ports:
            - containerPort: {{ .Values.bioMcpService.service.port }}
          env:
            - name: PORT
              value: "{{ .Values.bioMcpService.service.port }}"
            - name: BIOMCP_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-bio-mcp-service-secret
                  key: biomcp-api-key
            - name: OMIM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-bio-mcp-service-secret
                  key: omim-api-key
            - name: ENABLE_PLACEHOLDER_TOOLS
              value: "{{ .Values.bioMcpService.env.enablePlaceholderTools }}"
            - name: ENABLE_OMIM_PLACEHOLDER
              value: "{{ .Values.bioMcpService.env.enableOmimPlaceholder }}"
            - name: ENABLE_BLAST_PLACEHOLDER
              value: "{{ .Values.bioMcpService.env.enableBlastPlaceholder }}"
          readinessProbe:
            httpGet:
              path: /healthcheck
              port: {{ .Values.bioMcpService.service.port }}
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthcheck
              port: {{ .Values.bioMcpService.service.port }}
            initialDelaySeconds: 15
            periodSeconds: 10
{{- end }}
