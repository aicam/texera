apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .Release.Name }}-static-routes
  namespace: {{ .Release.Namespace }}
spec:
  parentRefs:
    - name: {{ .Release.Name }}-gateway
  {{- if and .Values.gatewayConfig .Values.gatewayConfig.hostname }}
  hostnames:
    - {{ .Values.gatewayConfig.hostname }}
  {{- end }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api/computing-unit
      backendRefs:
        - name: workflow-computing-unit-manager-svc
          port: 8888
    - matches:
        - path:
            type: PathPrefix
            value: /api/compile
      backendRefs:
        - name: workflow-compiling-service-svc
          port: 9090
    - matches:
        - path:
            type: PathPrefix
            value: /api/dataset
        - path:
            type: PathPrefix
            value: /api/access/dataset
      backendRefs:
        - name: file-service-svc
          port: 9092
    - matches:
        - path:
            type: PathPrefix
            value: /api/access/computing-unit
      backendRefs:
        - name: workflow-computing-unit-manager-svc
          port: 8888
    - matches:
        - path:
            type: PathPrefix
            value: /api/config
      backendRefs:
        - name: config-service-svc
          port: 9094
    - matches:
        - path:
            type: PathPrefix
            value: /api/models
        - path:
            type: PathPrefix
            value: /api/chat
      backendRefs:
        - name: access-control-service-svc
          port: 9096
    - matches:
        - path:
            type: PathPrefix
            value: /rtc
      backendRefs:
        - name: y-websocket-server-svc
          port: 1234
    - matches:
        - path:
            type: PathPrefix
            value: /python-language-server
      backendRefs:
        - name: python-language-server-svc
          port: 3000
    - matches:
        - path:
            type: PathPrefix
            value: /api
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: webserver-svc
          port: 8080
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .Release.Name }}-dynamic-routes
  namespace: {{ .Release.Namespace }}
spec:
  parentRefs:
    - name: {{ .Release.Name }}-gateway
  {{- if and .Values.gatewayConfig .Values.gatewayConfig.hostname }}
  hostnames:
    - {{ .Values.gatewayConfig.hostname }}
  {{- end }}
  rules:
    # Only the per-computing-unit websocket needs dynamic (per-cuid) routing via ext-auth. Result
    # export and runtime-stats endpoints live on the Dashboard Service (they read the committed
    # result/stats from the shared Iceberg catalog and need the Postgres DB), so they are NOT routed
    # to a computing-unit pod here — they fall through to the static "/api" rule -> webserver-svc, and
    # the dashboard performs its own JWT auth. (Routing them through the per-cuid dynamic backend sent
    # them to a CU pod that does not serve those endpoints, and ext-auth 403'd for lack of a cuid.)
    - matches:
        - path:
            type: PathPrefix
            value: /wsapi
      backendRefs:
        - group: gateway.envoyproxy.io
          kind: Backend
          name: texera-dynamic-backend
    - matches:
        - path:
            type: PathPrefix
            value: /pve
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /api/pve
      backendRefs:
        - group: gateway.envoyproxy.io
          kind: Backend
          name: texera-dynamic-backend
---
# Agent Service Route (a separate HTTPRoute so the BackendTrafficPolicy can
# target it for consistent-hash routing). Covers REST and the
# /api/agents/:id/react WebSocket. Longest-prefix matching gives /api/agents
# priority over the /api catch-all in the static routes above.
{{- if .Values.agentService.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .Release.Name }}-agent-service-route
  namespace: {{ .Release.Namespace }}
spec:
  parentRefs:
    - name: {{ .Release.Name }}-gateway
  {{- if and .Values.gatewayConfig .Values.gatewayConfig.hostname }}
  hostnames:
    - {{ .Values.gatewayConfig.hostname }}
  {{- end }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api/agents
      backendRefs:
        - name: agent-service-svc
          port: 3001
{{- end }}
